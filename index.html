<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ACCESS TERMINAL</title>

<style>
body {
  margin:0;
  background:#0b0500;
  color:#ffb347;
  font-family:monospace;
  overflow:hidden;
}

.terminal {
  padding:25px;
  font-size:15px;
  line-height:1.5;
  text-shadow:0 0 6px #ff9900;
}

.line { white-space:pre-wrap; }

.prompt { color:#ffd27a; }

.cursor::after {
  content:"█";
  animation:blink 1s infinite;
}

@keyframes blink { 50%{opacity:0;} }

body::before {
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.2) 2px,
    transparent 2px,
    transparent 4px
  );
}

body::after {
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle, transparent 60%, black 100%);
}

.glitch {
  animation: glitch 0.15s 6;
}

@keyframes glitch {
  0%{transform:translate(0)}
  25%{transform:translate(2px,-2px)}
  50%{transform:translate(-2px,2px)}
  75%{transform:translate(1px,-1px)}
  100%{transform:translate(0)}
}

.fade-out {
  animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
  to { opacity:0 }
}
</style>
</head>

<body>

<div class="terminal" id="term"></div>

<script>
const term = document.getElementById("term");

// 🔊 Som simples de tecla
const ctx = new (window.AudioContext || window.webkitAudioContext)();
function keySound(){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type="square";
  o.frequency.value = 200 + Math.random()*200;
  g.gain.value = 0.02;
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.03);
}

// helpers
function line(t=""){
  const d=document.createElement("div");
  d.className="line";
  d.textContent=t;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
  return d;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function type(el, text, speed=40){
  for(let c of text){
    el.textContent += c;
    keySound();
    await sleep(speed);
  }
}

// prompt com typing
async function prompt(cmd){
  const l=document.createElement("div");
  l.className="line";
  l.innerHTML=`<span class="prompt">root@matrix:~# </span>`;
  
  const span=document.createElement("span");
  l.appendChild(span);

  const cursor=document.createElement("span");
  cursor.className="cursor";
  l.appendChild(cursor);

  term.appendChild(l);

  await type(span, cmd, 40);
  cursor.remove();
  await sleep(200);
}

// espera ENTER real
function waitEnter(){
  return new Promise(resolve=>{
    function handler(e){
      if(e.key==="Enter"){
        document.removeEventListener("keydown", handler);
        resolve();
      }
    }
    document.addEventListener("keydown", handler);
  });
}

// INPUT fake (login)
async function inputPrompt(label, hidden=false){
  const l=document.createElement("div");
  l.className="line";
  l.textContent = label;
  term.appendChild(l);

  let value="";
  const inputLine=document.createElement("div");
  inputLine.className="line";
  term.appendChild(inputLine);

  return new Promise(resolve=>{
    function handler(e){
      if(e.key==="Enter"){
        document.removeEventListener("keydown", handler);
        resolve(value);
      } else if(e.key==="Backspace"){
        value=value.slice(0,-1);
      } else if(e.key.length===1){
        value+=e.key;
      }

      inputLine.textContent = hidden ? "*".repeat(value.length) : value;
    }
    document.addEventListener("keydown", handler);
  });
}

// FLOW
async function run(){

  // BOOT
  line("[ OK ] Initializing memory...");
  await sleep(200);
  line("[ OK ] Loading kernel...");
  await sleep(200);
  line("[ OK ] Starting services...");
  await sleep(200);
  line("");

  // LOGIN
  const user = await inputPrompt("login:");
  const pass = await inputPrompt("password:", true);

  line("");
  line("Authenticating...");
  await sleep(500);

  line("Access granted.");
  await sleep(300);

  line("");
  line("Press ENTER to continue...");
  await waitEnter();

  // COMMANDS
  await prompt("whoami");
  line(user || "guest");

  await prompt("hostname");
  line("nexus-core");

  await prompt("cat banner.txt");
  line(">> ACCESSING SECURE NODE");

  await prompt('echo "BEM VINDO"');
  line("BEM VINDO");

  // glitch
  term.classList.add("glitch");
  await sleep(500);

  await sleep(2000);

  // fade
  document.body.classList.add("fade-out");
  await sleep(1000);

  window.location.href="main.html";
}

run();
</script>

</body>
</html>
