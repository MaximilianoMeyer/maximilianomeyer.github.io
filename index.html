<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BOOT</title>

<style>
  body {
    margin: 0;
    background: #0b0500;
    color: #ffb347;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  /* CRT effect */
  body::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.2),
      rgba(0,0,0,0.2) 2px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
  }

  .terminal {
    text-align: center;
    font-size: 28px;
    text-shadow: 0 0 15px #ff9900;
    animation: glow 2s infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 5px #ff9900; }
    to { text-shadow: 0 0 25px #ffcc66; }
  }
</style>
</head>

<body>
  <div class="terminal">
    <div id="msg"></div>
  </div>

<script>
  const text = "Bem vindo";
  let i = 0;

  function type() {
    if (i < text.length) {
      document.getElementById("msg").innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 120);
    }
  }

  type();

  // redirect após 3s
  setTimeout(() => {
    window.location.href = "main.html";
  }, 3000);
</script>

</body>
</html>
