<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ACCESS TERMINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0b0500;color:#ffb347;
  font-family:monospace;
  overflow:hidden;height:100vh;width:100vw;
}
.terminal{
  padding:20px;font-size:14px;line-height:1.6;
  text-shadow:0 0 6px #ff9900;
  height:100vh;overflow-y:auto;
}
@media(max-width:600px){.terminal{font-size:12px;padding:14px;}}
.line{white-space:pre-wrap;word-break:break-all;}
.prompt{color:#ffd27a;}

/* ── GHOST INPUT ── completely invisible, just captures keyboard */
#ghost{
  position:fixed;
  left:-9999px;top:50%;
  width:1px;height:1px;
  opacity:0;
  font-size:16px;        /* no iOS zoom */
  border:none;outline:none;
  background:transparent;
  color:transparent;
  caret-color:transparent;
  resize:none;
}

/* blinking block cursor rendered inside terminal */
.cur{
  display:inline-block;width:9px;height:1em;
  background:#ffb347;vertical-align:text-bottom;
  animation:cb 1s steps(1) infinite;margin-left:1px;
}
@keyframes cb{50%{opacity:0;}}

#tapHint{
  position:fixed;bottom:18px;left:0;right:0;
  text-align:center;font-size:11px;letter-spacing:3px;
  color:#ff990055;pointer-events:none;transition:opacity .5s;
}

body::before{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.2),rgba(0,0,0,0.2) 2px,transparent 2px,transparent 4px);
  pointer-events:none;z-index:100;}
body::after{content:'';position:fixed;inset:0;
  background:radial-gradient(circle,transparent 60%,black 100%);
  pointer-events:none;z-index:100;}

.glitch{animation:glitch .15s 6;}
@keyframes glitch{
  0%{transform:translate(0)}25%{transform:translate(2px,-2px)}
  50%{transform:translate(-2px,2px)}75%{transform:translate(1px,-1px)}100%{transform:translate(0)}
}
.fade-out{animation:fadeOut 1s forwards;}
@keyframes fadeOut{to{opacity:0;}}
</style>
</head>
<body>

<div class="terminal" id="term"></div>
<input id="ghost" type="text"
  autocomplete="off" autocorrect="off" autocapitalize="none"
  spellcheck="false" inputmode="text">
<div id="tapHint">[ TOQUE NA TELA PARA DIGITAR ]</div>

<script>
const term  = document.getElementById('term');
const ghost = document.getElementById('ghost');
const hint  = document.getElementById('tapHint');

/* keep ghost focused — tap anywhere refocuses */
function focusGhost(){ghost.focus();ghost.value='';}

document.addEventListener('touchend', e=>{
  if(e.target!==ghost) focusGhost();
},{passive:true});
document.addEventListener('click', e=>{
  if(e.target!==ghost) focusGhost();
});

let hintGone=false;
function hideHint(){
  if(hintGone)return;hintGone=true;
  hint.style.opacity='0';
  setTimeout(()=>hint.style.display='none',600);
}

/* audio */
let actx;
function getCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function beep(){
  try{
    const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.type='square';o.frequency.value=200+Math.random()*200;
    g.gain.value=0.015;o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+0.03);
  }catch(e){}
}

/* helpers */
function addLine(t){
  t=(t===undefined)?'':t;
  const d=document.createElement('div');d.className='line';d.textContent=t;
  term.appendChild(d);term.scrollTop=term.scrollHeight;return d;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function typeOut(el,text,spd){
  spd=spd||40;
  for(const c of text){el.textContent+=c;beep();await sleep(spd);}
}
async function typedCommand(cmd){
  const l=document.createElement('div');l.className='line';
  l.innerHTML='<span class="prompt">root@matrix:~# </span>';
  const s=document.createElement('span');
  const c=document.createElement('span');c.className='cur';
  l.appendChild(s);l.appendChild(c);term.appendChild(l);
  await typeOut(s,cmd,40);c.remove();await sleep(200);
}

/* ── inputPrompt: ghost captures all typing, display in terminal ── */
function inputPrompt(label,hidden){
  hidden=hidden||false;
  addLine(label);

  const row=document.createElement('div');row.className='line';
  const txt=document.createElement('span');
  const cur=document.createElement('span');cur.className='cur';
  row.appendChild(txt);row.appendChild(cur);
  term.appendChild(row);term.scrollTop=term.scrollHeight;

  ghost.value='';
  focusGhost();

  return new Promise(resolve=>{
    let val='';

    function render(){
      txt.textContent=hidden?'*'.repeat(val.length):val;
      term.scrollTop=term.scrollHeight;
    }

    /* mobile: ghost.value changes via soft keyboard → input event */
    function onInput(){
      hideHint();
      val=ghost.value;
      beep();render();
    }

    /* desktop + mobile hardware keyboard */
    function onKey(e){
      hideHint();
      if(e.key==='Enter'){
        e.preventDefault();
        done(val);return;
      }
      if(e.key==='Backspace'){
        e.preventDefault();
        val=val.slice(0,-1);
        ghost.value=val;
        beep();render();return;
      }
    }

    function done(v){
      ghost.removeEventListener('input',onInput);
      ghost.removeEventListener('keydown',onKey);
      cur.remove();
      ghost.value='';
      resolve(v);
    }

    ghost.addEventListener('input',onInput);
    ghost.addEventListener('keydown',onKey);
  });
}

/* waitEnter: tap anywhere or press Enter */
function waitEnter(){
  const note=addLine('[ pressione ENTER ou toque para continuar ]');
  note.style.cssText='color:#ff990055;font-size:11px;letter-spacing:2px;';
  ghost.value='';focusGhost();

  return new Promise(resolve=>{
    function done(){
      ghost.removeEventListener('keydown',onKey);
      document.removeEventListener('touchend',onTouch);
      note.remove();resolve();
    }
    function onKey(e){if(e.key==='Enter'){e.preventDefault();done();}}
    function onTouch(){done();}
    ghost.addEventListener('keydown',onKey);
    setTimeout(()=>document.addEventListener('touchend',onTouch,{once:true,passive:true}),400);
  });
}

/* ── FLOW ── */
async function run(){
  document.addEventListener('touchstart',()=>{try{getCtx();}catch(e){}},{once:true});
  focusGhost();

  addLine('[ OK ] Initializing memory...');await sleep(200);
  addLine('[ OK ] Loading kernel...');await sleep(200);
  addLine('[ OK ] Starting services...');await sleep(300);
  addLine('');

  const user=await inputPrompt('login:');
  const pass=await inputPrompt('password:',true);

  addLine('');addLine('Authenticating...');await sleep(600);
  addLine('Access granted.');await sleep(400);
  addLine('');addLine('Press ENTER to continue...');
  await waitEnter();

  await typedCommand('whoami');addLine(user||'guest');
  await typedCommand('hostname');addLine('nexus-core');
  await typedCommand('cat banner.txt');addLine('>> ACCESSING SECURE NODE');
  await typedCommand('echo "BEM VINDO"');addLine('BEM VINDO');

  term.classList.add('glitch');await sleep(600);await sleep(1800);
  document.body.classList.add('fade-out');await sleep(1000);
  window.location.href='main.html';
}
run();
</script>
</body>
</html>
