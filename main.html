<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS OPERATOR</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --pink:#ff2e88;
  --blue:#00e5ff;
  --bg:#050507;
}

body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:'Share Tech Mono', monospace;
}

/* NAV */
.nav {
  position:fixed;
  width:100%;
  display:flex;
  justify-content:center;
  gap:40px;
  padding:15px;
  backdrop-filter:blur(10px);
  z-index:1000;
}

.nav a { color:#aaa; text-decoration:none; }
.nav a:hover { color:var(--blue); }

/* HERO */
.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px;
}

.hero h1 {
  font-size:60px;
  color:var(--blue);
}

/* SOCIAL CARDS */
.social {
  display:flex;
  gap:15px;
  margin-top:20px;
}

.social a {
  padding:10px 15px;
  border:1px solid rgba(255,255,255,0.1);
  text-decoration:none;
  color:#aaa;
  transition:0.3s;
}

.social a:hover {
  border-color:var(--pink);
  color:var(--pink);
}

/* ARSENAL */
.arsenal {
  padding:60px;
}

.arsenal-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.tool {
  border:1px solid rgba(0,229,255,0.3);
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#0a0a0f;
}

.dot {
  width:8px;
  height:8px;
  border-radius:50%;
}

/* TERMINAL */
#terminalModal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.96);
  display:none;
  justify-content:center;
  align-items:center;
}

.terminal {
  width:800px;
  height:450px;
  background:black;
  border:1px solid var(--blue);
  padding:20px;
  overflow:auto;
}

.line { color:#aaa; }
.cmd { color:var(--pink); }
.val { color:var(--blue); }

.cursor::after {
  content:"█";
  animation:blink 1s infinite;
}

@keyframes blink { 50%{opacity:0;} }

</style>
</head>

<body>

<nav class="nav">
  <a href="#">Research</a>
  <a href="#">Writeups</a>
  <a href="#">About</a>
  <a href="#" onclick="openTerminal()">Certificações</a>
  <a href="#">Contato</a>
</nav>

<div class="hero">
  <h1>NEXUS OPERATOR</h1>

  <!-- SOCIAL -->
  <div class="social">
    <a href="#">LinkedIn</a>
    <a href="#">HackTheBox</a>
    <a href="#">TryHackMe</a>
    <a href="#">GitHub</a>
  </div>
</div>

<!-- ARSENAL -->
<section class="arsenal">
  <h2 style="color:var(--blue)">Arsenal</h2>

  <div class="arsenal-grid">
    <div class="tool"><div class="dot" style="background:#00e5ff"></div> Burp Suite Pro</div>
    <div class="tool"><div class="dot" style="background:#ff8800"></div> BloodHound</div>
    <div class="tool"><div class="dot" style="background:#ff2e88"></div> Impacket</div>
    <div class="tool"><div class="dot" style="background:#00ff9c"></div> Metasploit</div>

    <div class="tool"><div class="dot" style="background:#00e5ff"></div> Nmap / Naabu</div>
    <div class="tool"><div class="dot" style="background:#ff8800"></div> Ghidra / x64dbg</div>
    <div class="tool"><div class="dot" style="background:#ff2e88"></div> CrackMapExec</div>
    <div class="tool"><div class="dot" style="background:#00ff9c"></div> Nuclei / FFUF</div>

    <div class="tool"><div class="dot" style="background:#00e5ff"></div> Wireshark</div>
    <div class="tool"><div class="dot" style="background:#aa66ff"></div> Python / Bash</div>
    <div class="tool"><div class="dot" style="background:#ffaa00"></div> PowerShell / Rust</div>
    <div class="tool"><div class="dot" style="background:#00ffaa"></div> Fortinet</div>
  </div>
</section>

<!-- TERMINAL -->
<div id="terminalModal">
  <div class="terminal" id="term"></div>
</div>

<script>
const modal = document.getElementById("terminalModal");
const term = document.getElementById("term");

let input="";
let inputSpan;

// FILESYSTEM
const fs = {
  certs: ["CEH","DCPT","CRTA","MCRTA"],
  notes: ["lab: hackthebox","focus: AD attacks","status: active"]
};

function openTerminal(){
  modal.style.display="flex";
  term.innerHTML="";

  print("Certification Terminal");
  print("type 'help'");
  newPrompt();
}

function print(text, cls="line"){
  const d=document.createElement("div");
  d.className=cls;
  d.textContent=text;
  term.appendChild(d);
  term.scrollTop=term.scrollHeight;
}

function newPrompt(){
  const line=document.createElement("div");
  line.innerHTML=`<span class="cmd">user@nexus:~$ </span><span id="input"></span><span class="cursor"></span>`;
  term.appendChild(line);
  inputSpan=line.querySelector("#input");
}

document.addEventListener("keydown", e=>{
  if(modal.style.display!=="flex") return;

  if(e.key==="Escape"){ modal.style.display="none"; return; }

  if(e.key==="Backspace"){
    input=input.slice(0,-1);
  }
  else if(e.key==="Enter"){
    execute(input.trim());
    input="";
    return;
  }
  else if(e.key.length===1){
    input+=e.key;
  }

  inputSpan.textContent=input;
});

function execute(cmd){
  print("user@nexus:~$ "+cmd,"cmd");

  const args = cmd.split(" ");

  switch(args[0]){

    case "help":
      print("ls | cat certs | cat notes | clear | exit");
      break;

    case "ls":
      print("certs notes");
      break;

    case "cat":
      if(fs[args[1]]){
        fs[args[1]].forEach(v=>print(v,"val"));
      } else {
        print("file not found");
      }
      break;

    case "clear":
      term.innerHTML="";
      break;

    case "exit":
      modal.style.display="none";
      return;

    default:
      print("command not found");
  }

  newPrompt();
}
</script>

</body>
</html>
