<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS CYBER</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --pink:#ff2e88;
  --blue:#00e5ff;
}

body {
  margin:0;
  background:#050507;
  color:white;
  font-family:'Share Tech Mono', monospace;
}

/* NAV */
.nav {
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:40px;
  padding:15px;
  backdrop-filter: blur(10px);
}

.nav a {
  color:#aaa;
  text-decoration:none;
}

.nav a:hover { color:var(--blue); }

/* HERO */
.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px;
}

.hero h1 {
  font-size:60px;
  color:var(--blue);
}

/* TERMINAL */
#terminalModal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.96);
  display:none;
  justify-content:center;
  align-items:center;
}

.terminal {
  width:800px;
  height:450px;
  background:black;
  border:1px solid var(--blue);
  padding:20px;
  overflow:auto;
}

.line { color:#aaa; }
.cmd { color:var(--pink); }
.val { color:var(--blue); }

.cursor::after {
  content:"█";
  animation:blink 1s infinite;
}

@keyframes blink { 50%{opacity:0;} }
</style>
</head>

<body>

<nav class="nav">
  <a href="#">Research</a>
  <a href="#">Writeups</a>
  <a href="#">About</a>
  <a href="#" onclick="openTerminal()">Certificações</a>
  <a href="#">Contato</a>
</nav>

<div class="hero">
  <h1>NEXUS OPERATOR</h1>
</div>

<div id="terminalModal">
  <div class="terminal" id="term"></div>
</div>

<script>
const modal = document.getElementById("terminalModal");
const term = document.getElementById("term");

let input = "";
let history = [];
let historyIndex = 0;
let inputSpan;

// fake filesystem
const fs = {
  certs: [
    "OSCP (in progress)",
    "CEH",
    "eJPT"
  ],
  notes: [
    "target: corp.local",
    "status: recon phase",
    "vector: web + AD"
  ]
};

function openTerminal(){
  modal.style.display="flex";
  term.innerHTML="";
  print("NEXUS CERTIFICATION TERMINAL");
  print("type 'help'");
  newPrompt();
}

function print(text, cls="line"){
  const d=document.createElement("div");
  d.className=cls;
  d.textContent=text;
  term.appendChild(d);
  term.scrollTop=term.scrollHeight;
}

function newPrompt(){
  const line=document.createElement("div");
  line.innerHTML=`<span class="cmd">user@nexus:~$ </span><span id="input"></span><span class="cursor"></span>`;
  term.appendChild(line);
  inputSpan = line.querySelector("#input");
}

document.addEventListener("keydown", e=>{
  if(modal.style.display!=="flex") return;

  if(e.key==="Escape"){ modal.style.display="none"; return; }

  if(e.key==="Backspace"){
    input=input.slice(0,-1);
  }
  else if(e.key==="Enter"){
    execute(input.trim());
    history.push(input);
    historyIndex = history.length;
    input="";
    return;
  }
  else if(e.key==="ArrowUp"){
    if(historyIndex>0) historyIndex--;
    input = history[historyIndex] || "";
  }
  else if(e.key==="ArrowDown"){
    if(historyIndex<history.length-1) historyIndex++;
    input = history[historyIndex] || "";
  }
  else if(e.key==="Tab"){
    e.preventDefault();
    autocomplete();
  }
  else if(e.key.length===1){
    input+=e.key;
  }

  inputSpan.textContent=input;
});

function execute(cmd){
  print("user@nexus:~$ " + cmd, "cmd");

  const args = cmd.split(" ");

  switch(args[0]){

    case "help":
      print("Commands: ls, cat, clear, whoami, hostname, exit");
      break;

    case "ls":
      print(Object.keys(fs).join(" "));
      break;

    case "cat":
      if(fs[args[1]]){
        fs[args[1]].forEach(v=>print(v,"val"));
      } else {
        print("file not found");
      }
      break;

    case "clear":
      term.innerHTML="";
      break;

    case "whoami":
      print("operator");
      break;

    case "hostname":
      print("nexus-core");
      break;

    case "exit":
      modal.style.display="none";
      return;

    default:
      print("command not found");
  }

  newPrompt();
}

function autocomplete(){
  const cmds = ["help","ls","cat","clear","whoami","hostname","exit"];
  const match = cmds.find(c=>c.startsWith(input));
  if(match) input = match;
}
</script>

</body>
</html>
